<!-- settings.html — Event Chronicle 扩展设置面板 -->
<!-- 由 SillyTavern 内联注入到扩展设置标签页中。 -->
<!-- ST 自动持久化所有带 name 属性的 <input> 值到 extension_settings['event-chronicle']。 -->

<div id="ec-settings-container">
  <h3>📜 Event Chronicle · 事件编年史</h3>
  <p class="ec-desc">
    从角色扮演对话中自动提取结构化事件，构建可视时间线，注入长期记忆。
    <a href="/extensions/event-chronicle/event-ui/timeline.html" target="_blank"
       class="ec-link">打开时间线浏览器 ↗</a>
  </p>

  <hr>

  <!-- ================================================================= -->
  <!-- 第 1 节：自动提取                                                 -->
  <!-- ================================================================= -->
  <h4>自动提取</h4>

  <div class="ec-form-group">
    <label for="ec-extract-trigger">
      每 N 条消息触发提取
      <span class="ec-hint">当聊天消息数累计达到该阈值时自动触发事件提取</span>
    </label>
    <input type="number" id="ec-extract-trigger" name="extractTriggerCount"
           min="3" max="100" value="10" step="1">
  </div>

  <div class="ec-form-group">
    <label for="ec-merge-trigger">
      每 N 条新事件触发整理
      <span class="ec-hint">累计新增事件数达到该阈值时自动触发合并去重</span>
    </label>
    <input type="number" id="ec-merge-trigger" name="mergeTriggerCount"
           min="2" max="50" value="5" step="1">
  </div>

  <div class="ec-form-group">
    <label for="ec-max-tokens">
      最大输出 Token（覆盖 ST 默认值）
      <span class="ec-hint">建议 2048 以上——确保 LLM 输出完整 JSON 结构</span>
    </label>
    <input type="number" id="ec-max-tokens" name="overrideMaxTokens"
           min="256" max="16384" value="2048" step="256">
  </div>

  <hr>

  <!-- ================================================================= -->
  <!-- 第 2 节：模型设置（可选）                                         -->
  <!-- ================================================================= -->
  <h4>模型设置 <span class="ec-optional-tag">可选</span></h4>
  <p class="ec-desc">
    为事件提取和合并使用独立的模型。留空则使用 SillyTavern 全局配置。
  </p>

  <div class="ec-form-row">
    <div class="ec-form-group ec-half">
      <label for="ec-llm-provider">提供商</label>
      <input type="text" id="ec-llm-provider" name="llmOverride.provider"
             placeholder="例如 openai">
    </div>
    <div class="ec-form-group ec-half">
      <label for="ec-llm-model">模型名称</label>
      <input type="text" id="ec-llm-model" name="llmOverride.model"
             placeholder="例如 gpt-4o-mini">
    </div>
  </div>

  <div class="ec-form-group">
    <label for="ec-llm-apikey">API 密钥</label>
    <input type="password" id="ec-llm-apikey" name="llmOverride.apiKey"
           placeholder="留空则使用 ST 全局 API Key">
  </div>

  <div class="ec-form-group">
    <label for="ec-llm-baseurl">接口地址</label>
    <input type="text" id="ec-llm-baseurl" name="llmOverride.baseUrl"
           placeholder="例如 https://api.openai.com/v1">
  </div>

  <div class="ec-form-row">
    <div class="ec-form-group ec-half">
      <label for="ec-llm-temperature">生成温度</label>
      <input type="number" id="ec-llm-temperature" name="llmOverride.temperature"
             min="0" max="2" value="0" step="0.1">
    </div>
    <div class="ec-form-group ec-half">
      <label for="ec-llm-max-tokens">最大 Token</label>
      <input type="number" id="ec-llm-max-tokens" name="llmOverride.maxTokens"
             min="256" max="16384" value="2048" step="256">
    </div>
  </div>

  <hr>

  <!-- ================================================================= -->
  <!-- 第 3 节：一键批量生成                                             -->
  <!-- ================================================================= -->
  <h4>一键批量生成</h4>
  <p class="ec-desc">
    从<strong>整个聊天历史</strong>中生成事件数据，使用增量切片避免超出 LLM 上下文限制。
    <span class="ec-warning">⚠ 注意：此操作将消耗大量 API Token！</span>
  </p>

  <div class="ec-form-group">
    <label for="ec-batch-slice">
      每次发送消息数
      <span class="ec-hint">每批消息越少 = LLM 调用次数越多，但单次 Token 消耗越少</span>
    </label>
    <input type="number" id="ec-batch-slice" name="batchSliceSize"
           min="2" max="20" value="5" step="1">
  </div>

  <div class="ec-actions">
    <button id="ec-batch-start" class="ec-btn ec-btn-primary">
      ▶ 开始批量生成
    </button>
    <button id="ec-batch-resume" class="ec-btn ec-btn-secondary" style="display:none;">
      ↻ 继续上次进度
    </button>
    <span id="ec-batch-status" class="ec-status"></span>
  </div>

  <div id="ec-batch-progress-container" style="display:none;">
    <div class="ec-progress-bar">
      <div id="ec-batch-progress-fill" class="ec-progress-fill"></div>
    </div>
    <div id="ec-batch-progress-text" class="ec-progress-text"></div>
  </div>

  <hr>

  <!-- ================================================================= -->
  <!-- 第 4 节：运行状态                                                 -->
  <!-- ================================================================= -->
  <h4>运行状态</h4>
  <div class="ec-status-display">
    <span id="ec-status-indicator" class="ec-indicator checking"></span>
    <span id="ec-status-text">正在检测...</span>
  </div>
  <div id="ec-status-detail" class="ec-status-detail"></div>
</div>

<!-- ===================================================================== -->
<!-- 样式（无变更）                                                        -->
<!-- ===================================================================== -->
<style>
  #ec-settings-container {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #d4d4d4;
    font-size: 14px;
    line-height: 1.5;
  }
  #ec-settings-container h3 {
    margin-bottom: 0.3em;
    color: #fff;
    font-size: 18px;
  }
  #ec-settings-container h4 {
    margin-top: 1.2em;
    margin-bottom: 0.5em;
    color: #ccc;
    font-size: 15px;
  }
  .ec-desc {
    color: #999;
    font-size: 0.9em;
    margin-bottom: 1em;
  }
  .ec-hint {
    display: block;
    color: #777;
    font-size: 0.8em;
    font-weight: normal;
    margin-top: 2px;
  }
  .ec-warning { color: #ffaa00; font-weight: 500; }
  .ec-optional-tag {
    color: #888;
    font-size: 0.75em;
    font-weight: normal;
  }

  /* Form groups */
  .ec-form-group { margin-bottom: 0.9em; }
  .ec-form-group label {
    display: block;
    margin-bottom: 4px;
    font-weight: 500;
    color: #ccc;
  }
  .ec-form-group input {
    width: 100%;
    padding: 7px 10px;
    border: 1px solid #444;
    border-radius: 4px;
    background: #1a1a1a;
    color: #e0e0e0;
    font-size: 14px;
    box-sizing: border-box;
  }
  .ec-form-group input:focus {
    border-color: #6c8cff;
    outline: none;
  }
  .ec-form-row { display: flex; gap: 12px; }
  .ec-half { flex: 1; }

  /* Buttons */
  .ec-actions { margin: 1em 0; display: flex; align-items: center; gap: 10px; }
  .ec-btn {
    padding: 8px 16px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.2s;
  }
  .ec-btn-primary { background: #4a6cf7; color: white; }
  .ec-btn-primary:hover { background: #5a7cf7; }
  .ec-btn-primary:disabled { background: #333; color: #666; cursor: not-allowed; }
  .ec-btn-secondary { background: #444; color: #ccc; }
  .ec-btn-secondary:hover { background: #555; }

  /* Status */
  .ec-status { color: #999; font-size: 0.9em; }
  .ec-status-display { display: flex; align-items: center; gap: 8px; }
  .ec-indicator {
    width: 10px; height: 10px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }
  .ec-indicator.ready { background: #4caf50; }
  .ec-indicator.error { background: #f44336; }
  .ec-indicator.checking { background: #ffaa00; animation: ec-pulse 1s infinite; }
  .ec-status-detail { margin-top: 6px; font-size: 0.8em; color: #777; }

  /* Progress bar */
  .ec-progress-bar {
    width: 100%; height: 8px;
    background: #2a2a2a;
    border-radius: 4px;
    margin-top: 8px;
    overflow: hidden;
  }
  .ec-progress-fill {
    height: 100%;
    background: #4a6cf7;
    border-radius: 4px;
    transition: width 0.3s ease;
    width: 0%;
  }
  .ec-progress-text { font-size: 0.8em; color: #999; margin-top: 4px; }

  /* Link */
  .ec-link {
    color: #6c8cff;
    font-size: 0.9em;
    margin-left: 8px;
  }

  @keyframes ec-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  hr {
    border: none;
    border-top: 1px solid #333;
    margin: 16px 0;
  }
</style>

<!-- ===================================================================== -->
<!-- 脚本                                                                  -->
<!-- ===================================================================== -->
<script src="/extensions/event-chronicle/settings/settings.js"></script>
